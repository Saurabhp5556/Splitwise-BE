name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: List target directory
        run: ls -la target/

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "target/*.jar"
          target: "/app/Splitwise-BE.jar"
          strip_components: 1

      - name: Deploy application on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Stop existing application
            PID=$(pgrep -f "Splitwise-BE.jar") || true
            if [ -n "$PID" ]; then
              echo "Stopping existing application (PID: $PID)"
              kill $PID || true
              sleep 5
              # Force kill if still running
              kill -9 $PID 2>/dev/null || true
            fi

            # Start new application
            echo "Starting application..."
            nohup java -jar /app/Splitwise-BE.jar > /app/app.log 2>&1 &

            # Wait a moment and verify it started
            sleep 2
            NEW_PID=$(pgrep -f "Splitwise-BE.jar") || true
            if [ -n "$NEW_PID" ]; then
              echo "Application deployed successfully! (PID: $NEW_PID)"
            else
              echo "Warning: Could not verify application started"
            fi
