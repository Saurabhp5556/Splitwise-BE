name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: List target directory
        run: ls -la target/

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "target/*.jar"
          target: "/app/tmp"
          strip_components: 1

      - name: Deploy application on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set +e  # Don't exit on error, we'll handle errors explicitly

            echo "=== Starting deployment ==="

            # Stop existing application
            echo "Checking for existing application..."
            PID=$(pgrep -f "Splitwise-BE.jar")
            if [ -n "$PID" ]; then
              echo "Stopping existing application (PID: $PID)"
              kill $PID 2>/dev/null
              sleep 5

              # Force kill if still running
              if pgrep -f "Splitwise-BE.jar" > /dev/null; then
                echo "Force killing application..."
                kill -9 $PID 2>/dev/null
                sleep 1
              fi
              echo "Application stopped successfully"
            else
              echo "No existing application found"
            fi

            # Verify new JAR exists
            echo "Checking for new JAR file..."
            if [ ! -f /app/tmp/Splitwise-BE.jar ]; then
              echo "ERROR: JAR file not found at /app/tmp/Splitwise-BE.jar"
              exit 1
            fi
            echo "New JAR file found"

            # Copy new JAR
            echo "Copying new JAR to /app/..."
            cp /app/tmp/Splitwise-BE.jar /app/Splitwise-BE.jar
            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to copy JAR file"
              exit 1
            fi
            echo "JAR copied successfully"

            # Cleanup
            echo "Cleaning up temporary files..."
            rm -rf /app/tmp

            # Start new application
            echo "Starting application..."
            cd /app
            nohup java -jar /app/Splitwise-BE.jar > /app/app.log 2>&1 &

            # Wait and verify it started
            sleep 3
            NEW_PID=$(pgrep -f "Splitwise-BE.jar")
            if [ -n "$NEW_PID" ]; then
              echo "=== Application deployed successfully! (PID: $NEW_PID) ==="
              exit 0
            else
              echo "=== ERROR: Application failed to start ==="
              echo "Last 20 lines of application log:"
              tail -n 20 /app/app.log 2>/dev/null || echo "No log file found"
              exit 1
            fi
